name: DB fallback hotfix once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DB startup fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          if 'DB_FALLBACK_V1' in s:
              raise SystemExit(0)

          old = '''DATABASE_URL = get_database_url()
USE_POSTGRES = bool(DATABASE_URL)
'''
          new = '''DATABASE_URL = get_database_url()
USE_POSTGRES = bool(DATABASE_URL)
DB_FALLBACK_V1 = True
CENTRAL_DB_FALLBACK = False

# 중앙 DB가 일시적으로 연결되지 않아도 사이트 자체는 정상 표시되도록
# 시작 시 짧게 연결 확인 후 실패하면 저장소의 SQLite 백업 DB로 임시 전환합니다.
if USE_POSTGRES:
    _probe = None
    try:
        _probe = psycopg2.connect(DATABASE_URL, connect_timeout=5)
    except psycopg2.OperationalError:
        DATABASE_URL = ""
        USE_POSTGRES = False
        CENTRAL_DB_FALLBACK = True
    finally:
        if _probe is not None:
            try:
                _probe.close()
            except Exception:
                pass
'''
          if old not in s:
              raise SystemExit('DB init block not found')
          s = s.replace(old, new, 1)

          old_caption = 'st.caption("☁ 중앙 DB 연결" if USE_POSTGRES else "💻 로컬 SQLite 모드")'
          new_caption = '''st.caption("☁ 중앙 DB 연결" if USE_POSTGRES else "💻 로컬 SQLite 모드")
if CENTRAL_DB_FALLBACK:
    st.warning("⚠ 중앙 DB 연결이 일시적으로 불가하여 백업 DB로 화면을 복구했습니다. 중앙 DB가 정상화되면 자동으로 다시 연결됩니다.")'''
          if old_caption in s:
              s = s.replace(old_caption, new_caption, 1)

          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'auto: keep site available when central DB is down'
          git push
