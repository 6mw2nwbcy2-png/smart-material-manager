name: Finalize material forms

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply form patch
        run: python tools/finalize_material_forms.py

      - name: Compile-check Python files
        run: |
          python -m py_compile app.py
          python -m py_compile pages/stone_impl.py
          python -m py_compile pages/stone_impl_v2.py

      - name: Commit patched app
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix material input forms and stone budget category"
          git push
