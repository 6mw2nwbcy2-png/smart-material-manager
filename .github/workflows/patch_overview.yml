name: Patch main overview

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch app.py safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          if '### 🚚 자재별 현장 반입 일정' in s:
              raise SystemExit(0)
          start = 'if menu == "한눈에 보기":'
          end = 'elif menu == "대시보드":'
          a = s.find(start)
          b = s.find(end, a)
          if a < 0 or b < 0:
              raise SystemExit('overview block not found')
          new = '''if menu == "한눈에 보기":
    st.subheader("한눈에 보기")
    totals = get_totals()
    today = date.today()

    try:
        if USE_POSTGRES:
            with psycopg2.connect(DATABASE_URL) as c:
                with c.cursor() as cur:
                    cur.execute("ALTER TABLE order_lines ADD COLUMN IF NOT EXISTS storage_location TEXT DEFAULT ''")
                c.commit()
        else:
            with sqlite3.connect(DB) as c:
                cols = {r[1] for r in c.execute("PRAGMA table_info(order_lines)").fetchall()}
                if "storage_location" not in cols:
                    c.execute("ALTER TABLE order_lines ADD COLUMN storage_location TEXT DEFAULT ''")
                    c.commit()
    except Exception:
        pass

    c1, c2, c3, c4 = st.columns(4)
    c1.metric("등록 예산 품목", f"{len(totals):,}종")
    c2.metric("누적 입고", f"{totals['received'].sum():,.1f}" if len(totals) else "0")
    c3.metric("누적 투입", f"{totals['used'].sum():,.1f}" if len(totals) else "0")
    active_orders = int(read("SELECT COUNT(*) AS n FROM orders WHERE order_complete=0").iloc[0]["n"])
    c4.metric("진행 중 발주", f"{active_orders:,}건")

    st.markdown("### 🚚 자재별 현장 반입 일정")
    delivery = read("""
        SELECT o.order_no,o.vendor,o.category,b.item_name,b.spec,b.unit,
               ol.qty,ol.requested_delivery_date,ol.destination,
               COALESCE(ol.storage_location,'') AS storage_location
        FROM order_lines ol
        JOIN orders o ON ol.order_id=o.id
        JOIN budget_items b ON ol.item_id=b.id
        WHERE o.order_complete=0
        ORDER BY ol.requested_delivery_date,o.id,ol.id
    """)
    if len(delivery):
        delivery["반입일_dt"] = pd.to_datetime(delivery["requested_delivery_date"], errors="coerce")
        def dday(x):
            if pd.isna(x): return "미정"
            diff=(x.date()-today).days
            return "D-Day" if diff==0 else (f"D-{diff}" if diff>0 else f"D+{abs(diff)}")
        delivery["일정"] = delivery["반입일_dt"].apply(dday)
        delivery["현장 반입 예정일"] = delivery["반입일_dt"].dt.strftime("%Y-%m-%d").fillna("미정")
        delivery["납품처"] = delivery["destination"].fillna("").replace("", "미지정")
        delivery["보관위치"] = delivery["storage_location"].fillna("").replace("", "미지정")
        show=delivery[["category","item_name","spec","vendor","qty","unit","현장 반입 예정일","일정","납품처","보관위치","order_no"]].copy()
        show.columns=["공종","품명","규격","협력사","수량","단위","현장 반입 예정일","일정","납품처","보관위치","발주번호"]
        st.dataframe(show,use_container_width=True,hide_index=True)
    else:
        st.info("현재 진행 중인 발주/반입 예정 품목이 없습니다.")

    st.markdown("### 📊 예산 대비 누적 입고율")
    if len(totals):
        chart=totals.copy()
        chart["입고율"]=chart.apply(lambda r:(r["received"]/r["budget_qty"]*100) if r["budget_qty"] else 0,axis=1)
        chart["품목"]=chart.apply(lambda r:f"{r['category']} | {r['item_name']}"+(f" ({r['spec']})" if str(r['spec']).strip() else ""),axis=1)
        chart=chart.sort_values("입고율",ascending=False).set_index("품목")
        st.bar_chart(chart[["입고율"]],use_container_width=True)
        detail=chart.reset_index()[["category","vendor","item_name","spec","unit","budget_qty","ordered","received","used","재고","입고율"]].copy()
        detail["입고율"]=detail["입고율"].round(1).astype(str)+"%"
        detail.columns=["공종","협력사","품명","규격","단위","예산수량","누적발주","누적입고","누적투입","현재재고","입고율"]
        st.dataframe(detail,use_container_width=True,hide_index=True)
    else:
        st.info("등록된 예산 품목이 없습니다.")

    if is_admin() and len(delivery):
        st.markdown("### 📦 자재 보관위치")
        st.caption("예: 지하주차장 2층 A구역")
        loc=delivery[["order_no","item_name","spec","qty","storage_location"]].copy()
        loc.columns=["발주번호","품명","규격","수량","보관위치"]
        edited=st.data_editor(loc,use_container_width=True,hide_index=True,disabled=["발주번호","품명","규격","수량"],column_config={"보관위치":st.column_config.TextColumn("보관위치")},key="overview_storage_location")
        if st.button("보관위치 저장",type="primary",key="overview_storage_save"):
            for _,r in edited.iterrows():
                execute("""UPDATE order_lines ol SET storage_location=? FROM orders o,budget_items b WHERE ol.order_id=o.id AND ol.item_id=b.id AND o.order_no=? AND b.item_name=? AND COALESCE(b.spec,'')=?""",(str(r.get("보관위치","") or "").strip(),str(r["발주번호"]),str(r["품명"]),str(r["규격"] or "")))
            st.success("보관위치가 중앙 DB에 저장되었습니다.")
            st.rerun()

'''
          p.write_text(s[:a]+new+s[b:],encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit patch to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'auto: patch main overview' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
