name: Temporary Open Access Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make all app users editable
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('app.py'), Path('pages/stone_impl.py')]
          changed = False
          for p in files:
              s = p.read_text(encoding='utf-8')
              old = 'def is_admin():\n    return bool(st.session_state.get("is_admin", False))'
              new = 'def is_admin():\n    # 테스트/초기 운영: 링크 접속자는 모두 관리자 수준의 입력·수정 권한을 가짐\n    return True'
              if old in s:
                  p.write_text(s.replace(old, new, 1), encoding='utf-8')
                  changed = True
                  print(f'patched: {p}')
              else:
                  print(f'already patched or pattern not found: {p}')

          if not changed:
              print('No patch required.')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pages/stone_impl.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "모든 사용자 입력 및 수정 권한 허용"
            git push
          fi
