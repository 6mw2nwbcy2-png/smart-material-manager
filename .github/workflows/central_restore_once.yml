name: Restore Central DB Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore central DB preferred runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---- app.py: remove forced backup mode, prefer central DB with safe fallback ----
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''# 안정화 1단계: 중앙 DB 장애가 사이트 전체를 막지 않도록 백업 DB로 고정 실행.
source = source.replace(
    "DATABASE_URL = get_database_url()\\nUSE_POSTGRES = bool(DATABASE_URL)",
    "DATABASE_URL = ''\\nUSE_POSTGRES = False",
    1,
)
'''
          new = '''# 중앙 DB를 우선 사용하고, 실제 연결 실패 시에만 백업 DB로 자동 전환합니다.
source = source.replace(
    "DATABASE_URL = get_database_url()\\nUSE_POSTGRES = bool(DATABASE_URL)",
    """DATABASE_URL = get_database_url()\nUSE_POSTGRES = bool(DATABASE_URL)\nCENTRAL_DB_FALLBACK = not USE_POSTGRES\nif USE_POSTGRES:\n    _probe = None\n    try:\n        _probe = psycopg2.connect(DATABASE_URL, connect_timeout=8)\n    except Exception:\n        USE_POSTGRES = False\n        DATABASE_URL = \"\"\n        CENTRAL_DB_FALLBACK = True\n    finally:\n        if _probe is not None:\n            try:\n                _probe.close()\n            except Exception:\n                pass""",
    1,
)
'''
          if old not in s:
              raise SystemExit('app.py forced-backup block not found')
          s = s.replace(old, new, 1)

          old_caption = '''source = source.replace(
    'st.caption("☁ 중앙 DB 연결" if USE_POSTGRES else "💻 로컬 SQLite 모드")',
    'st.caption("🛡 안정화 모드 · 백업 DB")\\nst.info("현재 사이트 안정화를 위해 백업 DB 모드로 운영 중입니다. 기존 기능은 유지하고 중앙 DB만 별도 복구합니다.")',
    1,
)
'''
          new_caption = '''source = source.replace(
    'st.caption("☁ 중앙 DB 연결" if USE_POSTGRES else "💻 로컬 SQLite 모드")',
    'st.caption("☁ 중앙 DB 연결" if USE_POSTGRES else "🛟 백업 DB 임시연결")\\nif CENTRAL_DB_FALLBACK:\\n    st.warning("중앙 DB에 연결할 수 없어 임시 백업 DB로 전환되었습니다. 연결이 정상화되면 자동으로 중앙 DB를 사용합니다.")',
    1,
)
'''
          if old_caption not in s:
              raise SystemExit('app.py caption block not found')
          s = s.replace(old_caption, new_caption, 1)
          p.write_text(s, encoding='utf-8')

          # ---- pages/4_Stone.py: central DB first, SQLite only as fallback ----
          p = Path('pages/4_Stone.py')
          s = p.read_text(encoding='utf-8')
          marker1 = "sqlite_bootstrap = '''"
          marker2 = "'''\nsource = source[:start] + sqlite_bootstrap + source[end:]"
          a = s.find(marker1)
          b = s.find(marker2, a)
          if a < 0 or b < 0:
              raise SystemExit('stone bootstrap block not found')
          hybrid = '''sqlite_bootstrap = \'\'\'DATABASE_URL = get_database_url()
USE_POSTGRES = bool(DATABASE_URL)
CENTRAL_DB_FALLBACK = not USE_POSTGRES

if USE_POSTGRES:
    _probe = None
    try:
        _probe = psycopg2.connect(DATABASE_URL, connect_timeout=8)
    except Exception:
        USE_POSTGRES = False
        DATABASE_URL = ""
        CENTRAL_DB_FALLBACK = True
    finally:
        if _probe is not None:
            try:
                _probe.close()
            except Exception:
                pass


def _pg_sql(sql):
    return sql.replace("?", "%s") if USE_POSTGRES else sql


def execute(sql, params=()):
    if USE_POSTGRES:
        with psycopg2.connect(DATABASE_URL, connect_timeout=8) as c:
            with c.cursor() as cur:
                cur.execute(_pg_sql(sql), params)
            c.commit()
    else:
        with sqlite3.connect(DB) as c:
            c.execute(sql, params)
            c.commit()


def read(sql, params=()):
    if USE_POSTGRES:
        with psycopg2.connect(DATABASE_URL, connect_timeout=8) as c:
            return pd.read_sql_query(_pg_sql(sql), c, params=params)
    with sqlite3.connect(DB) as c:
        return pd.read_sql_query(sql, c, params=params)


def ensure_schema():
    if USE_POSTGRES:
        with psycopg2.connect(DATABASE_URL, connect_timeout=8) as c:
            with c.cursor() as cur:
                for name, definition in [
                    ("delivery_recipient", "TEXT DEFAULT ''"),
                    ("delivery_phone", "TEXT DEFAULT ''"),
                    ("delivery_address", "TEXT DEFAULT ''"),
                    ("storage_location", "TEXT DEFAULT ''"),
                ]:
                    cur.execute(f"ALTER TABLE order_lines ADD COLUMN IF NOT EXISTS {name} {definition}")
                cur.execute("""CREATE TABLE IF NOT EXISTS order_attachments(
                    id SERIAL PRIMARY KEY,
                    order_id INTEGER NOT NULL,
                    file_name TEXT NOT NULL,
                    mime_type TEXT DEFAULT '',
                    file_size BIGINT DEFAULT 0,
                    file_data BYTEA NOT NULL,
                    created_at TEXT DEFAULT ''
                )""")
            c.commit()
    else:
        with sqlite3.connect(DB) as c:
            c.execute("""CREATE TABLE IF NOT EXISTS budget_items(
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                category TEXT NOT NULL,
                vendor TEXT DEFAULT '',
                item_name TEXT NOT NULL,
                spec TEXT DEFAULT '',
                unit TEXT NOT NULL,
                budget_qty REAL DEFAULT 0,
                tile_type TEXT DEFAULT '',
                application_type TEXT DEFAULT '',
                default_destination TEXT DEFAULT '',
                active INTEGER DEFAULT 1
            )""")
            c.execute("""CREATE TABLE IF NOT EXISTS transactions(
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                tx_date TEXT NOT NULL,
                item_id INTEGER NOT NULL,
                tx_type TEXT NOT NULL,
                qty REAL NOT NULL,
                destination TEXT DEFAULT '',
                note TEXT DEFAULT '',
                input_user TEXT DEFAULT ''
            )""")
            c.execute("""CREATE TABLE IF NOT EXISTS orders(
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                order_no TEXT UNIQUE,
                category TEXT NOT NULL,
                vendor TEXT DEFAULT '',
                order_date TEXT NOT NULL,
                partner_confirm INTEGER DEFAULT 0,
                internal_approval INTEGER DEFAULT 0,
                order_complete INTEGER DEFAULT 0,
                note TEXT DEFAULT ''
            )""")
            c.execute("""CREATE TABLE IF NOT EXISTS order_lines(
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                order_id INTEGER NOT NULL,
                item_id INTEGER NOT NULL,
                qty REAL NOT NULL,
                requested_delivery_date TEXT DEFAULT '',
                destination TEXT DEFAULT ''
            )""")
            existing = {row[1] for row in c.execute("PRAGMA table_info(order_lines)").fetchall()}
            for name in ["delivery_recipient", "delivery_phone", "delivery_address", "storage_location"]:
                if name not in existing:
                    c.execute(f"ALTER TABLE order_lines ADD COLUMN {name} TEXT DEFAULT ''")
            c.execute("""CREATE TABLE IF NOT EXISTS order_attachments(
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                order_id INTEGER NOT NULL,
                file_name TEXT NOT NULL,
                mime_type TEXT DEFAULT '',
                file_size INTEGER DEFAULT 0,
                file_data BLOB NOT NULL,
                created_at TEXT DEFAULT ''
            )""")
            c.commit()

\'\'\'\nsource = source[:start] + sqlite_bootstrap + source[end:]'''
          s = s[:a] + hybrid + s[b + len(marker2):]
          s = s.replace(
              "source = source.replace('st.caption(\"☁ 중앙 DB 연결\")', 'st.caption(\"🛡 안정화 모드 · 석재 발주 기능 복구\")', 1)",
              "source = source.replace('st.caption(\"☁ 중앙 DB 연결\")', 'st.caption(\"☁ 중앙 DB 연결\" if USE_POSTGRES else \"🛟 백업 DB 임시연결\")', 1)",
          )
          p.write_text(s, encoding='utf-8')
          PY

          python -m py_compile app.py pages/4_Stone.py pages/stone_impl_v2.py app_snapshot.py

      - name: Commit central DB restore
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py pages/4_Stone.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: prefer central DB with automatic safe fallback'
          git push
