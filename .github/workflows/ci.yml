name: Streamlit CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile app.py app_snapshot.py admin_settings_extra.py dashboard_extra.py db_runtime.py data_protection.py pages/4_Stone.py pages/stone_impl.py pages/stone_impl_v2.py

      - name: Verify production DB and immutability markers
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py').read_text(encoding='utf-8')
          admin = Path('admin_settings_extra.py').read_text(encoding='utf-8')
          protect = Path('data_protection.py').read_text(encoding='utf-8')
          stone = Path('pages/4_Stone.py').read_text(encoding='utf-8')

          for marker in [
              'Central PostgreSQL is the only writable database',
              'CI_ALLOW_SQLITE',
              'apply_central_db_protection',
              'dashboard_extra.py',
              'admin_settings_extra.py',
              'pages/4_Stone.py',
          ]:
              assert marker in app, f'app missing: {marker}'

          for marker in [
              '한 번 저장된 예산/품목의 핵심 내역은 수정하거나 삭제할 수 없습니다',
              '신규 예산 / 품목 추가',
              '신규 예산 / 품목 저장',
              '저장된 투입내역',
              '관리자도 수정하거나 삭제할 수 없습니다',
              '저장된 발주서 관리 / 삭제',
              '발주서 상태 저장',
              '선택 발주서 삭제',
              "DELETE FROM transactions WHERE tx_type='발주'",
          ]:
              assert marker in admin, f'admin missing: {marker}'

          for marker in [
              'smm_budget_item_immutable',
              'smm_budget_item_no_truncate',
              'smm_used_transaction_immutable',
              "OLD.tx_type = '투입'",
              'OLD.budget_qty IS DISTINCT FROM NEW.budget_qty',
              'OLD.active IS DISTINCT FROM NEW.active',
          ]:
              assert marker in protect, f'protection missing: {marker}'

          for marker in [
              '협력사 석재 발주서',
              'stone_order_attachments_v3',
              'pdf","xls","xlsx","dwg","dxf',
              'resolve_database_url',
          ]:
              assert marker in stone, f'stone missing: {marker}'

          print('production DB/immutability markers ok')
          PY

      - name: Streamlit UI smoke test
        env:
          CI_ALLOW_SQLITE: '1'
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          db = Path('material_manager_v11.db')
          at = AppTest.from_file('app.py', default_timeout=45).run()
          assert not at.exception, at.exception

          overview_text = '\n'.join(str(x.value) for x in at.markdown)
          for text in ['자재별 현장 반입 일정', '예산 대비 입고 현황', '지급자재 업체 담당자']:
              assert text in overview_text, text

          with sqlite3.connect(db) as c:
              cols = {r[1] for r in c.execute('PRAGMA table_info(budget_items)').fetchall()}
              if 'planned_delivery_date' not in cols:
                  c.execute("ALTER TABLE budget_items ADD COLUMN planned_delivery_date TEXT DEFAULT ''")
              if 'storage_location' not in cols:
                  c.execute("ALTER TABLE budget_items ADD COLUMN storage_location TEXT DEFAULT ''")
              item = c.execute("SELECT id FROM budget_items WHERE category='석재' AND active=1 ORDER BY id LIMIT 1").fetchone()
              if not item:
                  cur = c.execute(
                      """INSERT INTO budget_items(category,vendor,item_name,spec,unit,budget_qty,tile_type,application_type,default_destination,active)
                         VALUES(?,?,?,?,?,?,?,?,?,1)""",
                      ('석재','CI협력사','CI 석재','CI-001','M',10.0,'인조석','','현장'),
                  )
                  item_id = int(cur.lastrowid)
              else:
                  item_id = int(item[0])
              c.execute("""CREATE TABLE IF NOT EXISTS order_attachments(
                  id INTEGER PRIMARY KEY AUTOINCREMENT, order_id INTEGER NOT NULL,
                  file_name TEXT NOT NULL, mime_type TEXT DEFAULT '', file_size INTEGER DEFAULT 0,
                  file_data BLOB NOT NULL, created_at TEXT DEFAULT '')""")
              c.execute("DELETE FROM orders WHERE order_no='CI-ORDER-LOCK-001'")
              cur = c.execute(
                  "INSERT INTO orders(order_no,category,vendor,order_date,partner_confirm,internal_approval,order_complete,note) VALUES(?,?,?,?,0,0,0,?)",
                  ('CI-ORDER-LOCK-001','석재','CI협력사','2026-09-02','CI'),
              )
              oid = int(cur.lastrowid)
              c.execute(
                  "INSERT INTO order_lines(order_id,item_id,qty,requested_delivery_date,destination,delivery_recipient,delivery_phone,delivery_address) VALUES(?,?,?,?,?,?,?,?)",
                  (oid,item_id,1.0,'2026-09-03','현장','테스터','010-0000-0000','테스트주소'),
              )
              c.commit()

          at.sidebar.radio[0].set_value('석재')
          at.run()
          assert not at.exception, at.exception
          stone_text = '\n'.join(str(x.value) for x in at.markdown)
          assert '협력사 석재 발주서' in stone_text, stone_text
          assert '신규 석재 품목 추가' not in stone_text, stone_text
          labels = [getattr(x, 'label', '') for x in at.text_input]
          assert '협력사명' in labels, labels
          uploaders = [getattr(x, 'label', '') for x in at.file_uploader]
          assert '도해도 및 첨부파일 선택' in uploaders, uploaders

          at.session_state['is_admin'] = True
          at.sidebar.radio[0].set_value('관리자 설정')
          at.run()
          assert not at.exception, at.exception
          admin_text = '\n'.join(str(x.value) for x in at.markdown)
          for text in ['기존 예산 현황','신규 예산 / 품목 추가','저장된 투입내역','저장된 발주서 관리 / 삭제']:
              assert text in admin_text, text
          buttons = [getattr(x, 'label', '') for x in at.button]
          for label in ['신규 예산 / 품목 저장','발주서 상태 저장','선택 발주서 삭제']:
              assert label in buttons, buttons

          print('streamlit UI smoke test ok')
          PY
