name: Streamlit CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile app.py app_snapshot.py admin_settings_extra.py dashboard_extra.py db_runtime.py pages/4_Stone.py pages/stone_impl.py pages/stone_impl_v2.py

      - name: Verify production safety and feature markers
        run: |
          python - <<'PY'
          from pathlib import Path

          wrapper = Path('pages/4_Stone.py').read_text(encoding='utf-8')
          base = Path('pages/stone_impl_v2.py').read_text(encoding='utf-8')
          app = Path('app.py').read_text(encoding='utf-8')
          admin = Path('admin_settings_extra.py').read_text(encoding='utf-8')
          dashboard = Path('dashboard_extra.py').read_text(encoding='utf-8')
          runtime = Path('db_runtime.py').read_text(encoding='utf-8')

          required_wrapper = [
              '협력사 석재 발주서', 'stone_order_form_v3', 'stone_order_attachments_v3',
              'pdf","xls","xlsx","dwg","dxf', 'resolve_database_url', '조회 전용',
              'from contextlib import closing', 'with closing(psycopg2.connect',
          ]
          required_base = [
              'DATABASE_URL = get_database_url()', 'def seed_stone_items():',
              '### 최근 석재 발주 / 도해도',
          ]
          required_app = [
              'admin_settings_extra.py', 'dashboard_extra.py', 'CENTRAL_DB_FALLBACK',
              'historical budget visibility safety recovery', 'pages/4_Stone.py',
              'with closing(psycopg2.connect', 'migrate_supply_columns',
          ]
          required_admin = [
              '### 기존 예산 현황', 'admin_bulk_budget_editor_v7', '비활성 품목 복구',
              '### 저장된 발주서 관리 / 삭제', 'admin_saved_order_delete_editor_v2',
              '선택 발주서 삭제', '발주서 상태 저장',
              'DELETE FROM order_lines WHERE order_id=?',
              "DELETE FROM transactions WHERE tx_type='발주' AND note LIKE ?",
              'DELETE FROM orders WHERE id=?',
          ]
          required_dashboard = [
              '### 📅 자재별 현장 반입 일정', '현장반입 예정일', '보관위치',
              '반입일정 / 보관위치 저장', '### 📊 예산 대비 입고 현황',
              '입고율(%)', '### 📞 지급자재 업체 담당자',
          ]
          required_runtime = [
              'resolve_database_url', '_supabase_pooler_candidates', 'ThreadPoolExecutor',
              'pooler.supabase.com', '5432', '6543', 'aws-0', 'aws-1',
              'conn.close()', 'sslmode',
          ]

          for group_name, content, markers in [
              ('stone wrapper', wrapper, required_wrapper), ('stone base', base, required_base),
              ('app', app, required_app), ('admin', admin, required_admin),
              ('dashboard', dashboard, required_dashboard), ('runtime', runtime, required_runtime),
          ]:
              for marker in markers:
                  assert marker in content, f'{group_name}: missing marker: {marker}'

          # Obsolete auto-patch workflows must never return.
          obsolete = [
              '.github/workflows/one_time_stone_connection_cleanup.yml',
              '.github/workflows/stone_central_once.yml',
              '.github/workflows/stone-contact-hotfix.yml',
          ]
          for path in obsolete:
              assert not Path(path).exists(), f'obsolete workflow still exists: {path}'
          print('production safety and feature markers ok')
          PY

      - name: Streamlit UI smoke test
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          db = Path('material_manager_v11.db')

          # Base app / overview must render even without production secrets.
          at = AppTest.from_file('app.py', default_timeout=45).run()
          assert not at.exception, at.exception
          overview_text = '\n'.join(str(x.value) for x in at.markdown)
          assert '자재별 현장 반입 일정' in overview_text, overview_text
          assert '예산 대비 입고 현황' in overview_text, overview_text
          assert '지급자재 업체 담당자' in overview_text, overview_text

          # Prepare local-only CI rows; production central DB is never contacted in CI.
          with sqlite3.connect(db) as c:
              cols = {r[1] for r in c.execute('PRAGMA table_info(budget_items)').fetchall()}
              if 'planned_delivery_date' not in cols:
                  c.execute("ALTER TABLE budget_items ADD COLUMN planned_delivery_date TEXT DEFAULT ''")
              if 'storage_location' not in cols:
                  c.execute("ALTER TABLE budget_items ADD COLUMN storage_location TEXT DEFAULT ''")
              item = c.execute("SELECT id FROM budget_items WHERE category='석재' AND active=1 ORDER BY id LIMIT 1").fetchone()
              if not item:
                  cur = c.execute(
                      """INSERT INTO budget_items(category,vendor,item_name,spec,unit,budget_qty,tile_type,application_type,default_destination,active)
                         VALUES(?,?,?,?,?,?,?,?,?,1)""",
                      ('석재','CI협력사','CI 석재','CI-001','M',10.0,'인조석','','현장'),
                  )
                  item_id = int(cur.lastrowid)
              else:
                  item_id = int(item[0])
              c.execute("""CREATE TABLE IF NOT EXISTS order_attachments(
                  id INTEGER PRIMARY KEY AUTOINCREMENT, order_id INTEGER NOT NULL,
                  file_name TEXT NOT NULL, mime_type TEXT DEFAULT '', file_size INTEGER DEFAULT 0,
                  file_data BLOB NOT NULL, created_at TEXT DEFAULT '')""")
              c.commit()

          # Stone ordering and attachment UI.
          at.sidebar.radio[0].set_value('석재')
          at.run()
          assert not at.exception, at.exception
          page_text = '\n'.join(str(x.value) for x in at.markdown)
          assert '협력사 석재 발주서' in page_text, page_text
          assert '신규 석재 품목 추가' not in page_text, page_text
          assert '예산 / 기존 품목 저장' not in page_text, page_text
          labels = [getattr(x, 'label', '') for x in at.text_input]
          assert '협력사명' in labels, labels
          uploader_labels = [getattr(x, 'label', '') for x in at.file_uploader]
          assert '도해도 및 첨부파일 선택' in uploader_labels, uploader_labels

          # Disposable order for admin controls.
          with sqlite3.connect(db) as c:
              c.execute("DELETE FROM order_attachments WHERE order_id IN (SELECT id FROM orders WHERE order_no='CI-STONE-001')")
              c.execute("DELETE FROM order_lines WHERE order_id IN (SELECT id FROM orders WHERE order_no='CI-STONE-001')")
              c.execute("DELETE FROM transactions WHERE note LIKE '%CI-STONE-001%'")
              c.execute("DELETE FROM orders WHERE order_no='CI-STONE-001'")
              cur = c.execute(
                  "INSERT INTO orders(order_no,category,vendor,order_date,partner_confirm,internal_approval,order_complete,note) VALUES(?,?,?,?,0,0,0,?)",
                  ('CI-STONE-001','석재','CI협력사','2026-09-02','CI test'),
              )
              oid = int(cur.lastrowid)
              c.execute(
                  "INSERT INTO order_lines(order_id,item_id,qty,requested_delivery_date,destination,delivery_recipient,delivery_phone,delivery_address) VALUES(?,?,?,?,?,?,?,?)",
                  (oid,item_id,1.0,'2026-09-03','현장','테스터','010-0000-0000','테스트주소'),
              )
              c.commit()

          # Admin settings: budgets + bulk editor + order state/deletion.
          at.session_state['is_admin'] = True
          at.sidebar.radio[0].set_value('관리자 설정')
          at.run()
          assert not at.exception, at.exception
          admin_text = '\n'.join(str(x.value) for x in at.markdown)
          for text in ['기존 예산 현황','예산 / 품목 관리','저장된 발주서 관리 / 삭제']:
              assert text in admin_text, admin_text
          buttons = [getattr(x, 'label', '') for x in at.button]
          assert '예산 / 품목 전체 저장' in buttons, buttons
          assert '발주서 상태 저장' in buttons, buttons
          assert '선택 발주서 삭제' in buttons, buttons
          print('streamlit UI smoke test ok')
          PY
