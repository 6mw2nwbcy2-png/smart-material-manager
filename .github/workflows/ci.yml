name: Streamlit CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_LOCAL_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile app.py app_snapshot.py pages/admin_settings.py pages/4_Stone.py pages/stone_impl.py pages/stone_impl_v2.py

      - name: Data safety guard
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('app.py'), Path('pages/admin_settings.py'), Path('pages/4_Stone.py')]
          forbidden = [
              'DROP TABLE',
              'TRUNCATE TABLE',
              'DELETE FROM orders',
              'DELETE FROM order_lines',
              'DELETE FROM order_attachments',
              'DELETE FROM transactions',
          ]
          for path in files:
              text = path.read_text(encoding='utf-8').upper()
              for token in forbidden:
                  assert token not in text, f'destructive SQL blocked: {token} in {path}'
          print('data safety guard ok')
          PY

      - name: Verify production central DB markers
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          admin = Path('pages/admin_settings.py').read_text(encoding='utf-8')
          stone = Path('pages/4_Stone.py').read_text(encoding='utf-8')
          for marker in [
              'CI_LOCAL_DB',
              'ThreadedConnectionPool',
              '중앙 DB 연결 · 데이터 영구저장',
              'deleted_at',
              'data_change_log',
              'pages/admin_settings.py',
          ]:
              assert marker in app, f'missing app marker: {marker}'
          for marker in [
              '발주서 관리',
              '삭제 발주서 복구',
              '발주서 삭제(보관)',
              'SOFT_DELETE',
              'def _atomic',
          ]:
              assert marker in admin, f'missing admin marker: {marker}'
          for marker in [
              '협력사 석재 발주서',
              'stone_order_form_v4',
              'stone_order_attachments_v4',
              'pdf","xls","xlsx","dwg","dxf',
              '발주서 삭제(보관)',
              'SOFT_DELETE',
          ]:
              assert marker in stone, f'missing stone marker: {marker}'
          print('production markers ok')
          PY

      - name: Streamlit smoke test
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          db = Path('material_manager_v11.db')
          if db.exists():
              db.unlink()

          at = AppTest.from_file('app.py', default_timeout=40).run()
          assert not at.exception, at.exception

          # Normal stone order screen.
          at.sidebar.radio[0].set_value('석재')
          at.run()
          assert not at.exception, at.exception
          page_text = '\n'.join(str(x.value) for x in at.markdown)
          assert '협력사 석재 발주서' in page_text, page_text
          labels = [getattr(x, 'label', '') for x in at.text_input]
          assert '협력사명' in labels, labels

          # Seed one test order.
          with sqlite3.connect(db) as c:
              item = c.execute("SELECT id FROM budget_items WHERE category='석재' AND active=1 ORDER BY id LIMIT 1").fetchone()
              assert item, 'no stone item'
              item_id = int(item[0])
              cur = c.execute(
                  "INSERT INTO orders(order_no,category,vendor,order_date,partner_confirm,internal_approval,order_complete,note,deleted_at,deleted_by) VALUES(?,?,?,?,0,0,0,?,'','')",
                  ('CI-STONE-001','석재','CI협력사','2026-09-02','CI test'),
              )
              oid = int(cur.lastrowid)
              c.execute(
                  "INSERT INTO order_lines(order_id,item_id,qty,requested_delivery_date,destination,delivery_recipient,delivery_phone,delivery_address) VALUES(?,?,?,?,?,?,?,?)",
                  (oid,item_id,1.0,'2026-09-03','현장','테스터','010-0000-0000','테스트주소'),
              )
              c.commit()

          # Stone admin approval + safe-delete controls.
          at.session_state['is_admin'] = True
          at.sidebar.radio[0].set_value('석재')
          at.run()
          assert not at.exception, at.exception
          admin_stone_text = '\n'.join(str(x.value) for x in at.markdown)
          assert '관리자 결재 / 발주 관리' in admin_stone_text, admin_stone_text
          button_labels = [getattr(x, 'label', '') for x in at.button]
          assert '상태 저장' in button_labels, button_labels
          assert '발주서 삭제(보관)' in button_labels, button_labels

          # Global admin order management.
          at.sidebar.radio[0].set_value('관리자 설정')
          at.run()
          assert not at.exception, at.exception
          admin_text = '\n'.join(str(x.value) for x in at.markdown)
          assert '예산 / 품목 관리' in admin_text, admin_text
          assert '발주서 관리' in admin_text, admin_text
          admin_buttons = [getattr(x, 'label', '') for x in at.button]
          assert '발주 상태 저장' in admin_buttons, admin_buttons
          assert '발주서 삭제(보관)' in admin_buttons, admin_buttons

          print('streamlit smoke test ok')
          PY
