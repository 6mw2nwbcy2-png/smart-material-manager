name: Stone Central DB Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make stone use shared central DB resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pages/4_Stone.py')
          s = p.read_text(encoding='utf-8')
          start = s.find("stable_bootstrap = '''DATABASE_URL = get_database_url()")
          end = s.find("\n\ndef _pg_sql(sql):", start)
          if start < 0 or end < 0:
              raise SystemExit('stone central bootstrap block not found')
          prefix = '''stable_bootstrap = \'\'\'from db_runtime import resolve_database_url as _resolve_database_url
_DB_RESOLUTION = _resolve_database_url(get_database_url(), st.secrets)
DATABASE_URL = _DB_RESOLUTION.url
USE_POSTGRES = _DB_RESOLUTION.connected
CENTRAL_DB_ERROR = _DB_RESOLUTION.reason
CENTRAL_DB_ENDPOINT = _DB_RESOLUTION.endpoint
CENTRAL_DB_FALLBACK = not USE_POSTGRES
'''
          s = s[:start] + prefix + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile app.py app_snapshot.py db_runtime.py pages/4_Stone.py pages/stone_impl_v2.py admin_settings_extra.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/4_Stone.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use shared central DB resolver for stone'
          git push
