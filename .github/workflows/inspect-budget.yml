name: Inspect Budget Snapshot
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show budget snapshot
        run: |
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect('material_manager_v11.db')
          rows=c.execute("SELECT id,category,vendor,item_name,spec,unit,budget_qty,active FROM budget_items ORDER BY category,id").fetchall()
          print('COUNT', len(rows))
          for r in rows:
              print('|'.join(map(str,r)))
          PY
