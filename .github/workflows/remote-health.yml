name: Deployed App Health

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Streamlit deployment
        run: sleep 45

      - name: Diagnose and check deployed app
        env:
          APP_URL: https://d8fygpeejbjqgneyf8zw2x.streamlit.app
        run: |
          set -euo pipefail
          echo '=== root response headers ==='
          curl -sS -D - -o /tmp/root-body --connect-timeout 15 --max-time 30 --max-redirs 0 "$APP_URL/" || true
          echo '=== health response headers ==='
          curl -sS -D - -o /tmp/health-body --connect-timeout 15 --max-time 30 --max-redirs 0 "$APP_URL/_stcore/health" || true
          echo '=== health body ==='
          cat /tmp/health-body || true

          for i in 1 2 3 4 5; do
            echo "Health check $i/5"
            code=$(curl --connect-timeout 15 --max-time 30 -sS -o /tmp/health -w '%{http_code}' "$APP_URL/_stcore/health")
            echo "HTTP $code body=$(cat /tmp/health)"
            test "$code" = "200"
            grep -Eqi 'ok|healthy' /tmp/health
            sleep 5
          done
          echo 'deployed Streamlit health endpoint passed 5 checks'
