name: Deployed App Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Streamlit deployment
        run: sleep 40

      - name: Check deployed app endpoints
        env:
          APP_URL: https://d8fygpeejbjqgneyf8zw2x.streamlit.app
        run: |
          set -uo pipefail
          for path in / /_stcore/health /_stcore/host-config; do
            echo "===== $path ====="
            rm -f /tmp/h /tmp/b
            code=$(curl -sS -D /tmp/h -o /tmp/b --connect-timeout 15 --max-time 30 --max-redirs 0 -w '%{http_code}' "$APP_URL$path" || true)
            echo "HTTP $code"
            cat /tmp/h || true
            echo "BODY:"
            head -c 1000 /tmp/b || true
            echo
          done

          echo '===== repeated root checks ====='
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/b --connect-timeout 15 --max-time 30 --max-redirs 0 -w '%{http_code}' "$APP_URL/" || true)
            echo "root $i/5 HTTP $code"
            sleep 3
          done
