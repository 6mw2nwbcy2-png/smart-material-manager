name: Deployed App Front Door

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Streamlit deployment
        run: sleep 45

      - name: Check deployed Streamlit front door 5 times
        env:
          APP_URL: https://d8fygpeejbjqgneyf8zw2x.streamlit.app
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "Remote front-door check $i/5"
            rm -f /tmp/h /tmp/b
            code=$(curl -sS -D /tmp/h -o /tmp/b --connect-timeout 15 --max-time 30 --max-redirs 0 -w '%{http_code}' "$APP_URL/")
            echo "HTTP $code"
            cat /tmp/h

            if [ "$code" = "200" ]; then
              grep -Eqi 'streamlit|text/html' /tmp/h /tmp/b
            elif [ "$code" = "303" ]; then
              # Streamlit may redirect automated/cloud clients through its auth front door.
              # This still proves the deployed subdomain is alive; functional UI is verified by AppTest in ci.yml.
              grep -Eqi 'share\.streamlit\.io/.*/auth|share\.streamlit\.io/-/auth' /tmp/h /tmp/b
            else
              echo "Unexpected deployed-app HTTP status: $code"
              exit 1
            fi
            sleep 5
          done
          echo 'deployed Streamlit front door passed 5 checks'
