name: Public App Access Guard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Streamlit deployment
        run: sleep 45

      - name: Verify public app access 5 times
        env:
          APP_URL: https://d8fygpeejbjqgneyf8zw2x.streamlit.app
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "Public access check $i/5"
            rm -f /tmp/h /tmp/b
            code=$(curl -sS -D /tmp/h -o /tmp/b --connect-timeout 15 --max-time 30 --max-redirs 0 -w '%{http_code}' "$APP_URL/")
            echo "HTTP $code"
            if [ "$code" != "200" ]; then
              cat /tmp/h
              echo "ERROR: deployed app is not anonymously public (expected HTTP 200)."
              exit 1
            fi
            grep -Eqi 'text/html|streamlit' /tmp/h /tmp/b
            sleep 5
          done
          echo 'public Streamlit app passed 5 anonymous-access checks'
