name: One-time Stone Connection Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close every stone PostgreSQL connection
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pages/4_Stone.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "stable_bootstrap = '''from db_runtime import resolve_database_url as _resolve_database_url",
              "stable_bootstrap = '''from contextlib import closing\nfrom db_runtime import resolve_database_url as _resolve_database_url",
              1,
          )
          s = s.replace(
              'with psycopg2.connect(DATABASE_URL, connect_timeout=7) as c:',
              'with closing(psycopg2.connect(DATABASE_URL, connect_timeout=7, application_name="smart-material-manager")) as c:',
          )
          s = s.replace(
              '(" · Pooler" if CENTRAL_DB_ENDPOINT == "pooler" else "")',
              '(" · Pooler" if str(CENTRAL_DB_ENDPOINT).startswith("pooler") else "")',
          )
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile pages/4_Stone.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/4_Stone.py
          git diff --cached --quiet && exit 0
          git commit -m 'stability: close stone PostgreSQL connections'
          git push
