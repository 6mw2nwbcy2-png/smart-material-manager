name: One-off stone routing fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Apply one-off stone routing fix')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace switch_page with inline stone runner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''if menu == "석재":\n    st.switch_page("pages/4_Stone.py")'''
          new = '''if menu == "석재":\n    import runpy\n    runpy.run_path("pages/stone_impl.py", run_name="__main__")\n    st.stop()'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-off workflow
        run: rm -f .github/workflows/oneoff-fix-stone-routing.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/oneoff-fix-stone-routing.yml
          git commit -m "Apply one-off stone routing fix"
          git push
