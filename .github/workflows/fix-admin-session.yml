name: Fix admin session

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore session-based admin mode
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''def is_admin():\n    # 테스트/초기 운영: 링크 접속자는 모두 관리자 수준의 입력·수정 권한을 가짐\n    return True'''
          new = '''def is_admin():\n    return bool(st.session_state.get("is_admin", False))'''
          if old not in s:
              raise SystemExit('target admin function not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Fix admin login and logout session"
          git push
